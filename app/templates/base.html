<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Inventario Demo{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>
    <div class="page-shell">
        <header class="site-header">
            <div>
                <p class="eyebrow">Gestión comercial</p>
                <h1><a href="{{ url_for('web.public_catalog') }}">[INSERTAR TÍTULO]</a></h1>
            </div>
            <nav class="site-nav">
                <a href="{{ url_for('web.public_catalog') }}">Catálogo</a>
                <a href="{{ url_for('web.admin_dashboard') }}">Panel</a>
                <a href="{{ url_for('web.admin_products') }}">Productos</a>
                <a href="{{ url_for('web.new_sale') }}">Ventas</a>
            </nav>
        </header>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <section class="flash-stack">
            {% for category, message in messages %}
            <article class="flash flash-{{ category }}">{{ message }}</article>
            {% endfor %}
        </section>
        {% endif %}
        {% endwith %}

        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>

</html>
